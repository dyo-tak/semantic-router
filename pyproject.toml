[project]
name = "semantic-router"
version = "0.1.0"
description = "Laya-powered semantic triage engine for support tickets — System-1 routing with LLM only for escalation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "tokenizers>=0.23.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_router"]

[tool.pytest.ini_options]
markers = [
    "model: tests that need the real Laya ONNX bundle (skipped in CI)",
]
addopts = "-m 'not model'"
