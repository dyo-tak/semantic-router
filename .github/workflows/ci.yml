name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Run tests (model-marked tests skipped)
        run: uv run pytest -q
      - name: Import smoke
        run: uv run python -c "import semantic_router; print(semantic_router.__version__)"
